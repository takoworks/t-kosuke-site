<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ZINE連携画像</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #f4f4f2;
      color: #171817;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    }

    main {
      width: min(100%, 960px);
    }

    figure {
      margin: 0;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 32px);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <img
        src="../../media/1c213b0f5d435b0c02ef8304de11a98d.webp"
        srcset="
          ../../media/1c213b0f5d435b0c02ef8304de11a98d.webp 960w,
          ../../media/591191405db8c532eaca73e1b2f112d1.webp 1600w
        "
        sizes="(max-width: 992px) calc(100vw - 32px), 960px"
        width="1600"
        height="1200"
        decoding="async"
        fetchpriority="high"
        alt="青いクリップと透明なリング状の部品が写った写真"
      >
    </figure>
  </main>
</body>
</html>
